name: Scan and Deploy

# Runs the real Strategy/ engine once (backend --scan-once - see Program.cs),
# sends any qualifying Telegram alerts, publishes a signals.json snapshot
# alongside the built Angular frontend to GitHub Pages, and persists the
# engine's calendar/news/dedup caches to the bot-state branch so the next
# scheduled run warm-starts instead of re-spending quota-limited providers'
# daily budgets from zero.
#
# One-time manual setup required (cannot be done from a workflow file):
#   1. Repo Settings -> Pages -> Source: "GitHub Actions".
#   2. Repo Settings -> Secrets and variables -> Actions -> add:
#      TWELVEDATA__APIKEYS, FINNHUB__APIKEYS, ALPHAVANTAGE__APIKEYS
#      (each comma-separated if you have more than one key),
#      TELEGRAM__BOTTOKEN, TELEGRAM__CHATID.
#      (GITHUB_TOKEN is automatic - no need to add it.)
on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes - GitHub may delay this under load
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write # push updated cache state to the bot-state branch
  pages: write # deploy to GitHub Pages
  id-token: write # required by actions/deploy-pages

concurrency:
  group: scan-and-deploy
  cancel-in-progress: false # never cancel a run mid-scan; let it finish and land its state

jobs:
  scan-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore or create bot-state branch (persisted calendar/news/alert-dedup cache)
        run: |
          if git ls-remote --exit-code --heads origin bot-state > /dev/null 2>&1; then
            git clone --branch bot-state --single-branch --depth 1 \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" state
          else
            git clone --depth 1 \
              "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" state
            cd state
            git checkout --orphan bot-state
            git rm -rf . > /dev/null 2>&1 || true
          fi

      - name: Warm-start backend/.cache from bot-state
        run: |
          mkdir -p backend/.cache
          cp -v state/cache/*.json backend/.cache/ 2>/dev/null || echo "No prior state to restore - first run."

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build backend
        run: dotnet build backend/RealtouchSmartTrade.Api.csproj -c Release -o backend-build

      - name: Run one-shot scan (real engine + Telegram alerts)
        env:
          ASPNETCORE_ENVIRONMENT: Production
          # Without this, ContentRootPath defaults to the job's CWD (the repo
          # root, since this step has no working-directory override) instead
          # of backend/ - meaning .cache/*.json (calendar/news/context caches,
          # alert dedup state, the qualification ledger) silently landed at
          # <repo-root>/.cache instead of backend/.cache, which every other
          # step in this workflow reads from/writes to. Confirmed via a real
          # local repro: none of that state was ever actually round-tripping
          # through the bot-state branch - every run started cold, which is
          # why Telegram re-alerted on setups that hadn't actually changed
          # and why the signal tracker's history wasn't accumulating.
          ASPNETCORE_CONTENTROOT: ${{ github.workspace }}/backend
          # Right-hand side names match what's actually configured in this
          # repo's Settings -> Secrets and variables -> Actions (double
          # underscore, no separating underscore before "APIKEYS") - GitHub
          # secrets can't be renamed in place, so this maps to them as-is
          # rather than requiring six secrets to be deleted and recreated.
          TwelveData__ApiKeys: ${{ secrets.TWELVEDATA__APIKEYS }}
          Finnhub__ApiKeys: ${{ secrets.FINNHUB__APIKEYS }}
          AlphaVantage__ApiKeys: ${{ secrets.ALPHAVANTAGE__APIKEYS }}
          Marketaux__ApiKeys: ${{ secrets.MARKETAUX__APIKEYS }}
          Telegram__BotToken: ${{ secrets.TELEGRAM__BOTTOKEN }}
          Telegram__ChatId: ${{ secrets.TELEGRAM__CHATID }}
          SIGNALS_OUTPUT_PATH: ${{ github.workspace }}/signals.json
          SIGNAL_LOG_OUTPUT_PATH: ${{ github.workspace }}/signal-log.json
          DIAGNOSTICS_OUTPUT_PATH: ${{ github.workspace }}/diagnostics.json
          RECONCILIATION_OUTPUT_PATH: ${{ github.workspace }}/reconciliation.json
        run: dotnet backend-build/RealtouchSmartTrade.Api.dll --scan-once

      - name: Persist updated cache state to bot-state branch
        run: |
          cd state
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # This branch got a bare `git push` here before, which fails outright
          # (no retry) whenever ANYTHING else has moved bot-state since this
          # run's checkout at the start of the job - a manual data fix pushed
          # directly to bot-state, or another concurrent run. That real run
          # (#108) lost its entire scan's state because of exactly this: the
          # push was rejected and nothing retried. Re-copying backend/.cache's
          # real output fresh on every attempt (it's untouched by git ops in
          # here) means a retry never re-sends stale data - it's always this
          # run's actual latest result, just rebased onto whatever the
          # remote's current tip turns out to be.
          for attempt in 1 2 3 4 5; do
            mkdir -p cache
            cp -v ../backend/.cache/*.json cache/ 2>/dev/null || true
            git add -A
            if git diff --cached --quiet; then
              echo "No state changes to persist."
              break
            fi
            git commit -q -m "Update scan state"
            if git push -q origin bot-state; then
              echo "Pushed on attempt $attempt."
              break
            fi
            if [ "$attempt" = "5" ]; then
              echo "::error::Failed to push bot-state after 5 attempts - this run's scan state was NOT persisted."
              exit 1
            fi
            echo "Push rejected (attempt $attempt) - bot-state moved concurrently. Re-syncing and retrying..."
            git fetch -q origin bot-state
            git reset -q --hard origin/bot-state
            sleep $((attempt * 3))
          done

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Copy signals snapshot into the frontend build
        run: |
          cp signals.json frontend/dist/frontend/browser/signals.json
          cp signal-log.json frontend/dist/frontend/browser/signal-log.json
          cp diagnostics.json frontend/dist/frontend/browser/diagnostics.json
          cp reconciliation.json frontend/dist/frontend/browser/reconciliation.json || echo "no reconciliation report this run"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
